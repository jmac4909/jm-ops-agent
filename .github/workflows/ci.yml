name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify on Linux
        if: runner.os != 'Windows'
        run: ./mvnw --batch-mode -Djmops.publication.scanHistory=true -Djmops.publication.historyRef=HEAD clean verify
      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: mvnw.cmd --batch-mode -Djmops.publication.scanHistory=true -Djmops.publication.historyRef=HEAD clean verify
