name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify on Linux
        if: runner.os != 'Windows'
        run: ./mvnw --batch-mode -Djmops.publication.scanHistory=true -Djmops.publication.historyRef=HEAD clean verify
      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: mvnw.cmd --batch-mode -Djmops.publication.scanHistory=true -Djmops.publication.historyRef=HEAD clean verify
