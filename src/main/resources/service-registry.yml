services:
  - service: edge-gateway
    runtime:
      platform:
        DEV: EKS
        TEST: EKS
    aliases:
      - demo-edge-gateway-dev
      - demo-edge-gateway-test
      - demo-public-api-gateway
    gitlab:
      repository: https://gitlab.example.invalid/demo/edge-gateway
    tasBranches:
      - demo-develop
    eksBranches:
      - demo-develop-eks
    eks:
      namespace:
        DEV: demo-edge-gateway-dev
        TEST: demo-edge-gateway-test
      deployment: demo-edge-gateway
      service: demo-edge-gateway
    tas:
      appPattern: demo-edge-gateway-{environment}
    jenkins:
      job: demo/edge-gateway/deploy
    splunk:
      indexes:
        apigee: demo_gateway_events
        eks: demo_container_events
        tas: demo_platform_events
    health:
      readinessPath: /actuator/health/readiness
      livenessPath: /actuator/health/liveness

  - service: identity-service
